name: Benchmark

on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Neovim
        uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: stable
      - name: Run benchmarks
        run: make bench 2>&1 | tee bench_output.txt
      - name: Post benchmark results to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete previous benchmark comment if it exists. List comments via
          # the REST API: it returns numeric comment ids usable with the
          # issues/comments endpoint, whereas `gh pr view --json comments`
          # returns GraphQL node ids that 404 against that REST endpoint.
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- pinwords-bench -->")) | .id' | while read -r id; do
            gh api --method DELETE "repos/${{ github.repository }}/issues/comments/${id}"
          done

          # Post new comment
          cat <<EOF > bench_comment.md
          <!-- pinwords-bench -->
          ## Benchmark Results

          \`\`\`
          $(cat bench_output.txt)
          \`\`\`
          EOF

          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file bench_comment.md
